[build]
target = "index.html"
# The public URL is injected at build time for GitHub Pages via the CI workflow:
#   trunk build --release --public-url /
# For local development (`trunk serve`) the default public URL of "/" is used.

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[tools]
# Pin the trunk auto-install version used by the build if desired.
# version = "0.21.14"

# Build-time artifacts (rss.xml, sitemap.xml, robots.txt) are declared as
# copy-file assets in index.html - Trunk copies them into its staging dir,
# so they survive the final dist assembly (a post_build hook writing to
# dist/ gets wiped by it).
#
# copy-file assets run concurrently with the rust pipeline, so on a clean
# checkout the files would not exist yet. This hook makes sure they do by
# running the host build first: build.rs regenerates the artifacts (its
# `rerun-if-changed=content` tracks the posts) before Trunk starts copying.
# `cargo` is used directly instead of `sh` so the hook works on Windows too.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["build", "-q"]

# NOTE: per-post static pages are generated by `cargo run --bin post_build`
# (src/bin/post_build.rs) as a CI step in deploy.yml, after `trunk build`
# finishes. A Trunk post_build hook runs BEFORE Trunk assembles dist/, so
# dist/index.html is not available there - the workflow step reads the
# fully-built dist/index.html instead.