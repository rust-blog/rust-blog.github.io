name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # Channel, targets, and components are pinned via rust-toolchain.toml
        # so CI and local builds use the exact same toolchain.

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"

      - name: Build (release)
        # public-url is "/" for GitHub Pages org/user sites, or "/<repo>/" for project sites.
        run: trunk build --release --public-url /

      - name: Prepare SPA fallback (404.html)
        # Serve the app shell for unknown paths so client-side routing works.
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
