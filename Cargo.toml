[package]
name = "rust-blog"
version = "0.2.0"
edition = "2024"
description = "A production-grade blog built with Leptos (CSR) and Rust, deployed on GitHub Pages"
license = "MIT"
repository = "https://github.com/rust-blog/rust-blog.github.io"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_meta = "0.8"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
include_dir = "0.7"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "Storage",
    "Location",
    "Element",
    "Node",
    "HtmlCollection",
    "MediaQueryList",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[build-dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rss = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
