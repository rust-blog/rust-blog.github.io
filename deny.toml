# cargo-deny configuration: advisory, license, and ban gates for the
# dependency graph. `cargo deny check` runs in CI (deploy.yml) alongside
# `cargo audit`; both must stay green before anything ships.

[advisories]
yanked = "deny"
# Accepted-risk advisories, each with the reason it stays. All four crates
# are at their latest published version; nothing newer exists to move to.
ignore = [
  # Build-time proc-macro helper pulled in by leptos_macro; never ships in
  # the WASM binary and is used by the whole ecosystem.
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is the latest version; proc-macro helper only, not in the shipped binary" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1 is the latest version; build-time only, via leptos_macro" },
  # syntect transitive deps, embedded at render time; no maintained
  # replacements exist that syntect would accept.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is the latest 1.x; only used by syntect's on-disk dump feature, which this app never invokes" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust 0.4.5 is the latest version; syntect pins 0.4 and the maintained fork (yaml-rust2) is not used by syntect" },
]

[licenses]
# Every dependency must be under one of these permissive licenses.
# The project itself is MIT (see LICENSE).
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []